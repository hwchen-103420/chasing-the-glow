<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>觀夕平台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preload" href="assets/fonts/guanxi-round.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="src/app.js"></script>
</head>
<body>
<div class="app">
  <!-- 提示橫幅：平常 hidden；資料過期用 banner--stale，取不到資料用 banner--error -->
  <div id="banner" class="banner banner--stale" role="status" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>
    <span class="banner-text">資料不是今天的</span>
  </div>

  <main class="main">
    <div class="map-wrap">
      <div id="map" aria-label="北部夕陽地圖"></div>
      <div class="legend" aria-label="圖例">
        <div class="legend-row">
          <span class="legend-item"><span class="swatch tier-poor"></span>Poor</span>
          <span class="legend-item"><span class="swatch tier-fair"></span>Fair</span>
          <span class="legend-item"><span class="swatch tier-good"></span>Good</span>
          <span class="legend-item"><span class="swatch tier-great"></span>Great</span>
          <span class="legend-item"><span class="swatch tier-nodata"></span>暫無分數</span>
        </div>
        <div class="legend-row">
          <span class="legend-item"><img src="assets/icons/status-sea.svg" alt="">落到海平面</span>
          <span class="legend-item"><img src="assets/icons/status-blocked.svg" alt="">落到山稜後</span>
          <span class="legend-item"><img src="assets/icons/status-afterglow.svg" alt="">只有晚霞</span>
          <span class="legend-item"><img src="assets/icons/veto.svg" alt="">不建議</span>
        </div>
      </div>
      <!-- 詳情卡浮層：程式放入 tpl-detail，關閉時 hidden -->
      <div id="detail" hidden></div>
    </div>

    <aside class="panel">
      <header class="brand">
        <h1>觀夕平台</h1>
        <p>今天傍晚，值不值得出門看夕陽</p>
      </header>

      <div id="today" class="today">
        <div class="today-now"><span class="today-date"></span><span class="today-time"></span></div>
        <span class="today-sunset">今日日落 <b>—</b></span>
      </div>

      <section class="section">
        <div class="section-head"><h2>今日概況</h2></div>
        <div id="regions"></div>
      </section>

      <section class="section">
        <div class="section-head"><h2>常造訪的景點</h2></div>
        <div id="favorites"></div>
      </section>

      <footer id="updated">
        <span class="updated-time"></span>
        <span class="updated-src">資料來源：Sunsethue・中央氣象署・aviationweather.gov・YouTube 直播</span>
      </footer>
    </aside>
  </main>
</div>

<!-- ============ 模板 ============ -->
<!-- 根元素加上 tier-* / is-vetoed / status-* class -->

<template id="tpl-region-card">
  <article class="region-card">
    <header class="card-head">
      <h3 class="card-name" data-field="name"></h3>
      <span class="tier-chip" data-field="tier-text"></span>
    </header>
    <div class="score">
      <span class="q-label">觀夕指數</span>
      <span class="quality" data-field="quality"></span>
    </div>
    <p class="wx-line"><span data-field="wx"></span><span data-field="temp"></span><span class="pop">降雨 <b data-field="pop"></b></span></p>
    <p class="window"><span class="label">最佳時段</span><span data-field="window"></span></p>
    <ul class="flags" data-field="flags"></ul>
  </article>
</template>

<template id="tpl-tooltip">
  <div class="tip">
    <header class="card-head">
      <h3 class="card-name" data-field="name"></h3>
      <span class="tier-chip" data-field="tier-text"></span>
    </header>
    <div class="score">
      <span class="quality" data-field="quality"></span>
      <span class="status-text" data-field="status-text"></span>
    </div>
    <p class="wx-line"><span data-field="wx"></span><span data-field="temp"></span><span class="pop">降雨 <b data-field="pop"></b></span></p>
    <ul class="flags" data-field="flags"></ul>
  </div>
</template>

<template id="tpl-favorite-card">
  <div class="fav-card" role="button" tabindex="0">
    <div class="fav-inner">
      <header class="card-head">
        <h3 class="card-name" data-field="name"></h3>
        <span class="tier-chip" data-field="tier-text"></span>
      </header>
      <span class="quality" data-field="quality"></span>
      <span class="status-text" data-field="status-text"></span>
      <div class="fav-more">
        <p class="wx-line"><span data-field="wx"></span><span data-field="temp"></span><span class="pop">降雨 <b data-field="pop"></b></span></p>
        <ul class="flags" data-field="flags"></ul>
      </div>
    </div>
  </div>
</template>

<template id="tpl-detail">
  <article class="detail-card">
    <header class="detail-head">
      <div class="detail-title">
        <h2 data-field="name"></h2>
        <span class="tier-chip" data-field="tier-text"></span>
      </div>
      <div class="detail-score">
        <span class="quality" data-field="quality"></span>
        <span class="status-text" data-field="status-text"></span>
      </div>
      <button class="detail-close" type="button" data-field="close" aria-label="關閉">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="detail-cam">
      <div class="cam-frame" data-field="cam"></div>
      <span class="cam-label" data-field="cam-label">天氣參考</span>
      <button class="cam-switch" type="button" data-field="cam-switch">切換鏡頭</button>
    </div>
    <div class="detail-body">
      <p class="wx-line"><span data-field="wx"></span><span data-field="temp"></span><span class="pop">降雨 <b data-field="pop"></b></span></p>
      <p class="window"><span class="label">最佳時段</span><span data-field="window"></span></p>
      <ul class="flags" data-field="flags"></ul>
    </div>
    <footer class="detail-actions">
      <a class="cam-open" data-field="cam-open" href="#" target="_blank" rel="noopener">在 YouTube 開啟</a>
      <a class="btn-nav" data-field="nav" href="#" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2Z"/></svg>
        Google 地圖導航
      </a>
    </footer>
  </article>
</template>
</body>
</html>
